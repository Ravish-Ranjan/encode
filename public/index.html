<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Generator API - Frontend</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f7f8fa;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      text-align: center;
      margin: 40px 0 20px;
    }
    h1 {
      margin: 0;
      color: #333;
    }
    form {
      background: white;
      padding: 20px 30px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    label {
      font-weight: 600;
      color: #444;
    }
    input, select, textarea {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      width: 100%;
    }
    input[type="color"] {
      width: 60px;
      height: 35px;
      padding: 0;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover {
      background: #0064d6;
    }
    #result {
      margin-top: 30px;
      text-align: center;
    }
    #qrImage {
      max-width: 250px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 10px;
    }
    footer {
      margin-top: auto;
      padding: 15px;
      color: #777;
      font-size: 13px;
    }
    code {
      background: #eee;
      padding: 2px 4px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <header>
    <h1>QR Code Generator API</h1>
    <p>Generate QR codes for text, URLs, WiFi, vCard, and more.</p>
    <p>For api reference visit <a href="https://github.com/Ravish-Ranjan/encode">github.com/Ravish-Ranjan/encode</a></p>
  </header>

  <form id="qrForm">
    <label for="type">QR Type:</label>
    <select id="type" required>
      <option value="text_url">Text / URL</option>
      <option value="wifi">WiFi</option>
      <option value="vcard">vCard</option>
      <option value="mecard">MeCard</option>
      <option value="email">Email</option>
      <option value="sms">SMS</option>
      <option value="tel">Telephone</option>
      <option value="geo">Geo Location</option>
      <option value="calendar">Calendar Event</option>
      <option value="bitcoin">Bitcoin</option>
      <option value="upi">UPI</option>
    </select>

    <label for="data">Data (JSON or Query Params):</label>
    <textarea id="data" rows="5" placeholder='For text_url: {"text_url": "Hello World"}&#10;For WiFi: {"type": "WPA", "ssid": "MyNetwork", "password": "mypassword"}' required></textarea>

    <div style="display:flex; gap:10px;">
      <div>
        <label for="fg">Foreground Color:</label>
        <input type="color" id="fg" value="#000000" />
      </div>
      <div>
        <label for="bg">Background Color:</label>
        <input type="color" id="bg" value="#ffffff" />
      </div>
    </div>

    <label for="method">Request Method:</label>
    <select id="method">
      <option value="GET">GET</option>
      <option value="POST">POST</option>
    </select>

    <button type="submit">Generate QR</button>
  </form>

  <div id="result">
    <h3>Generated QR Code:</h3>
    <img id="qrImage" src="" alt="QR Code will appear here" hidden />
    <p id="qrUrl"></p>
  </div>

  <footer>
    <p>API: <code>https://encode-9qc6.onrender.com/api/create/&lt;type&gt;</code></p>
    <p>Made by <a href="https://github.com/Ravish-Ranjan" target="_blank">Ravish Ranjan</a></p>
  </footer>

  <script>
    const form = document.getElementById('qrForm');
    const qrImg = document.getElementById('qrImage');
    const qrUrl = document.getElementById('qrUrl');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const type = document.getElementById('type').value;
      const method = document.getElementById('method').value;
      const fg = document.getElementById('fg').value;
      const bg = document.getElementById('bg').value;
      const dataInput = document.getElementById('data').value;

      let url = `https://encode-9qc6.onrender.com/api/create/${type}`;
      let options = { method };

      try {
        const parsed = JSON.parse(dataInput);

        if (method === 'GET') {
          const params = new URLSearchParams({ ...parsed, fg, bg });
          url += `?${params.toString()}`;
        } else {
          options.headers = { 'Content-Type': 'application/json' };
          options.body = JSON.stringify({ ...parsed, fg, bg });
        }

        const res = await fetch(url, options);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const blob = await res.blob();
        const imgURL = URL.createObjectURL(blob);
        qrImg.src = imgURL;
        qrImg.hidden = false;
        qrUrl.innerHTML = `<a href="${url}" target="_blank">${url}</a>`;
      } catch (err) {
        alert('Invalid data or request failed: ' + err.message);
      }
    });
  </script>
</body>
</html>
